name: kb2ctf-blind-rce
services:
  blind-rce:
    user: 10001:10001
    init: true
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 2048
        hard: 4096
    cgroup_parent: ${KB2CTF_CGROUP_PARENT:-kb2ctf-challenges.slice}
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 1.0
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    build: .
    environment:
      - FLAG=KB2CTF{blind_rce_demo}
    ports:
      - 127.0.0.1:8087:51338
    networks:
    - blind_net
    sysctls:
      net.ipv4.ping_group_range: 10001 10001
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:51338/',timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
networks:
  blind_net:
    ipam:
      config:
      - subnet: ${KB2CTF_IPV4_PREFIX:-10.203}.1.0/24
    name: ${COMPOSE_PROJECT_NAME}_blind_net_isolated
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ${KB2CTF_BRIDGE_PREFIX:-kbctf}-blind

{% extends "base.html" %}{% block title %}Burger Storage{% endblock %}{% block service %}Burger Storage{% endblock %}
{% block body %}<h1>Burger Storage</h1><p class="lead">Загрузите файл в своё хранилище.</p><section class="card">{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
